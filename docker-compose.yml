name: bedrock-wordpress-frankenphp

services:
    wordpress:
        env_file: ".env"
        build:
            context: .
            dockerfile: ./Dockerfile
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./bedrock/web/app/uploads:/app/bedrock/web/app/uploads
            - ./log:/var/log:rw
        depends_on:
            - db

    db:
        image: mysql:8.4
        restart: unless-stopped
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "3306:3306"

volumes:
    db_data:

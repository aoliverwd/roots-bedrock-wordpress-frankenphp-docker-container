name: bedrock-wordpress-frankenphp

services:
    wordpress:
        env_file: ".env"
        build:
            context: .
            dockerfile: ./Dockerfile-sqlite
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./bedrock/web/app/uploads:/app/bedrock/web/app/uploads
            - ./bedrock/sqlite:/app/bedrock/sqlite
            - ./log:/var/log:rw
